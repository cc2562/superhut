org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP 9 已移除 Jetifier；项目依赖均为 AndroidX，无需再开启。
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# flutter_inappwebview_android 1.1.3 仍引用 getDefaultProguardFile('proguard-android.txt')，
# 而 AGP 9 默认拒绝它（该文件带 -dontoptimize）。插件尚未发布修复版
# （github.com/pichillilorenzo/flutter_inappwebview/issues/2852），这里用 AGP 提供的
# 官方逃生开关临时放行。AGP 10 会移除该开关，届时必须升级插件或换掉它。
android.r8.proguardAndroidTxt.disallowed=false
