name: SuperHUT Mini

on:
  pull_request:
    paths: ["wechat-mini-program/**", ".github/workflows/wechat-mini-program.yml"]
  push:
    branches: [main]
    paths: ["wechat-mini-program/**", ".github/workflows/wechat-mini-program.yml"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wechat-mini-program
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: wechat-mini-program/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
